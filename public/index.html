<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Old Gabs" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Old Gabs 1era</title>
  </head>
  <body style="margin:0;background:#0d0f14">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        var swReg = null;
        function checkForUpdate() {
          if (swReg) swReg.update();
        }
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            swReg = reg;
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated') {
                  window.location.reload();
                }
              });
            });
          });
        });
        // Clave para la PWA instalada en el celular: al reabrirla desde el
        // icono, iOS/Android muchas veces no vuelve a disparar 'load'
        // (retoman la sesion en pausa) — por eso revisamos tambien aca.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') checkForUpdate();
        });
        window.addEventListener('pageshow', checkForUpdate);
        window.addEventListener('focus', checkForUpdate);
      }
    </script>
  </body>
</html>
